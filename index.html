<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#15584d">
<title>PawQi — Less keeping track. More being together.</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#fffdf8;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0;background:#fffdf8}
</style>
</head>
<body>
<iframe id="pawqiMain" src="review.html" title="PawQi"></iframe>
<script>
const frame=document.getElementById('pawqiMain');
frame.addEventListener('load',()=>{
  try{
    const d=frame.contentDocument;
    d.title='PawQi — Less keeping track. More being together.';
    const style=d.createElement('style');
    style.textContent=`
      /* Main homepage sharp-image pass — keep raster art at native-friendly ratios. */
      @media (min-width:981px){
        .hero-grid{grid-template-columns:1.08fr .92fr!important;gap:38px!important}
        .hero-art{min-height:430px!important;display:flex!important;align-items:center!important;justify-content:center!important;background:radial-gradient(circle at 58% 50%,#efe4d7 0,#fffaf3 72%)!important}
        .hero-art>img{width:min(100%,458px)!important;height:auto!important;max-height:414px!important;object-fit:contain!important;object-position:center!important;border-radius:26px!important}
        .service-grid{grid-template-columns:repeat(4,minmax(0,1fr))!important}
        .service img{width:auto!important;height:auto!important;max-width:240px!important;max-height:165px!important;object-fit:contain!important;margin:auto!important}
        .memory img{width:auto!important;height:auto!important;max-width:240px!important;max-height:220px!important;object-fit:contain!important;margin:auto!important}
        .closing-image img{width:auto!important;height:auto!important;max-width:458px!important;max-height:414px!important;object-fit:contain!important;margin:auto!important}
        .feature img{width:auto!important;height:auto!important;max-width:140px!important;max-height:150px!important;object-fit:contain!important}
      }
      @media (min-width:641px) and (max-width:980px){
        .hero-art>img{width:min(100%,458px)!important;height:auto!important;object-fit:contain!important;margin:auto!important}
        .service img{width:auto!important;height:auto!important;max-width:220px!important;max-height:155px!important;object-fit:contain!important;margin:auto!important}
      }
      @media (max-width:640px){
        .hero-art{min-height:0!important;padding:10px!important}
        .hero-art>img{width:min(100%,458px)!important;height:auto!important;max-height:none!important;object-fit:contain!important;object-position:center!important}
        .service img{width:auto!important;height:auto!important;max-width:176px!important;max-height:118px!important;object-fit:contain!important;margin:auto!important}
        .memory img,.closing-image img{width:auto!important;height:auto!important;max-width:100%!important;object-fit:contain!important;margin:auto!important}
      }
    `;
    d.head.appendChild(style);
    d.querySelectorAll('a[href="index.html"],a[href="index.html#home"]').forEach(a=>{a.href='#home';a.textContent=a.textContent.replace('Current homepage','Home').replace('Current site','Home')});
  }catch(e){console.warn('PawQi presentation layer',e)}
});
</script>
</body>
</html>
